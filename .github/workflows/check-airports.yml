name: 检测机场在线状态

on:
  # 每 12 小时检测一次（每天 2 轮，错开整点）
  # 频率刻意压低：既要结果够新，也要顾及 GitHub Actions 的免费额度和对方站点的感受
  schedule:
    - cron: '23 */12 * * *'
  # 机场配置有变动时立即重测
  push:
    branches: [ master ]
    paths:
      - 'public/assets/scripts/configs/airports/**'
      - 'public/assets/scripts/configs/airports-data.js'
      - 'public/assets/scripts/configs/airport-config.js'
      - 'scripts/check-airports.js'
  # 允许手动触发
  workflow_dispatch:

permissions:
  contents: write

# 同一时间只允许一个探测任务在跑，避免多个触发源叠加成并发请求
concurrency:
  group: check-airports
  cancel-in-progress: false

jobs:
  check-airports:
    runs-on: ubuntu-latest
    # 兜底：真出意外也不会一直挂着耗额度
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 检测所有机场站点
        run: npm run check-airports

      - name: 提交状态文件
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git pull --rebase --autostash origin master || true
          git add public/assets/data/airport-status.json
          if git diff --staged --quiet; then
            echo "状态无变化，跳过提交"
          else
            git commit -m "更新机场在线状态 | 定时探测结果同步"
            git push origin master
          fi
