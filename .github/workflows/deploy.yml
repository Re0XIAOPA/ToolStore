name: Update and Deploy

on:
  # 在推送到master分支时触发
  push:
    branches: [ master ]
  # 手动触发
  workflow_dispatch:
  # 每天凌晨2点自动更新
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      # 安装根目录依赖
      - name: Install Root Dependencies
        run: npm install

      # 更新下载链接
      - name: Update Downloads
        run: npm run update-downloads
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      # 检查 docs 目录是否有变化,如果有则构建文档
      - name: Check docs changes
        id: docs-check
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^docs/'; then
            echo "docs_changed=true" >> $GITHUB_OUTPUT
          else
            echo "docs_changed=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      # 安装文档依赖(只在 docs 有变化时)
      - name: Install Docs Dependencies
        if: steps.docs-check.outputs.docs_changed == 'true'
        run: |
          cd docs
          npm ci

      # 构建文档(只在 docs 有变化时)
      - name: Build Documentation
        if: steps.docs-check.outputs.docs_changed == 'true'
        run: |
          cd docs
          npm run build

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Pull Latest Changes
        run: git pull --rebase --autostash origin master

      - name: Commit and Push Changes
        run: |
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            if [ "${{ steps.docs-check.outputs.docs_changed }}" == "true" ]; then
              git commit -m "🚀 更新下载链接和文档 | 🔄 同步最新发布信息 [skip ci]"
            else
              git commit -m "🚀 更新下载链接和版本 | 🔄 同步最新发布信息 [skip ci]"
            fi
            git push origin master
          fi

      # 构建阶段生成机场在线状态数据。
      # 该产物已在 .gitignore 中排除，不会回写源码分支，只随本次构建发布到部署分支
      - name: 检测机场在线状态
        run: npm run check-airports

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          commit_message: "🌐 部署网站更新 | 📦 更新内容和资源文件"
          force_orphan: false 
